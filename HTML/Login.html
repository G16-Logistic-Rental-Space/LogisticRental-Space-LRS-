<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../CSS/mainStyle.css">
</head>

<body>
  <div class="container">
    <div class="LoginCard">
      <h1 class="login">Login</h1>
      <i class="bi bi-person-circle"></i>
      <form onsubmit="loginUser(event)">
        <label for="username">username</label>
        <input id="username" type="text" placeholder="Username" class="input-box"><br>
        <div id="usernameError" class="error-message"></div>
      <label for="password">password</label>
        <input id="password" type="password" placeholder="Password" class="input-box"><br>
        <div id="passwordError" class="error-message"></div>

        <div id="loginSuccess" class="success-message"></div>

        <button type="submit" class="btn" id="logBtn">Login</button>
      </form>

      <div class="RegisterLink">
        <p>Don't have an account? <a href="signup.html">Register</a></p>
      </div>
    </div>
  </div>
<script src="../JavaScript/User.js"></script>
<script src="../JavaScript/loginValidation.js"></script>
</body>
</html>
