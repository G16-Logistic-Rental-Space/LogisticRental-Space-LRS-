<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sign up </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../CSS/mainStyle.css">
</head>

<body>
  <div class="container">
    <div class="SignupCard">
      <h1 class="signup">Sign up</h1>
      <form onsubmit="signupUser(event)">
        <label for="fullname">Full Name</label>
        <input id="fullname" type="text" placeholder="Full name" class="input-box" ><br>
        <div id="fullnameError"class="error-message"></div>
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Username must start with a letter, and be 3–20 characters" class="input-box" ><br>
        <div id="usernameError"class="error-message"></div>
        <label for="password">password</label>
        <input id="password" type="password" placeholder=" password should include  uppercase, lowercase, number, and symbol" class="input-box" ><br>
        <div id="passwordError"class="error-message"></div>
        <label for="confirm">confirm password</label>
        <input id="confirm" type="password" placeholder="confirm password" class="input-box" ><br>
        <div id="confirmError"class="error-message"></div>
        <label for="mobile">mobile number</label>
        <input id="mobile" type="text" placeholder="must start with 05 or 9665 and be 10 digits long"  class="input-box" >
        <div id="mobileError"class="error-message"></div>
        <h3>user type</h3>
        
 <div class="userType">
    <label class="radio-container">
      <input type="radio" name="userType" value="Truck owner">
      <span>Truck owner</span>
    </label><br>

    <label class="radio-container">
      <input type="radio" name="userType" value="Customer">
      <span>Customer</span>
    </label>
 </div>
      <div id="userTypeError"class="error-message"></div>
        <div id="signupSuccess"></div>
        <button type="submit" class="btn">Sign up</button>
      </form>
    </div>
  </div>
<script src="../JavaScript/User.js"></script>
<script src="../JavaScript/signupValidation.js"></script>
</body>
</html>
