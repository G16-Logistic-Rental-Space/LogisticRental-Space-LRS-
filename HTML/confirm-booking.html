<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Confirm Booking</title>
    <link rel="stylesheet" href="../CSS/adStyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

    <nav>
        <a class="active"><i class="bi bi-badge-ad-fill"></i> Advertising Page</a>
        <a href="#"><i class="bi bi-clipboard-check-fill"></i> Rental Requests</a>
        <a href="#"><i class="bi bi-clock-history"></i> Booking History</a>
        <a href="#"><i class="bi bi-bell-fill"></i> Notifications</a>
        <a href="HomePage.html"><i class="bi bi-box-arrow-right"></i> Log out</a>
    </nav>

    <header class="topbar">
        <input type="text" placeholder="search booking">
        <div class="profile-icon"><i class="bi bi-person-circle"></i></div>
    </header>

    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-box">
            <h3>✔️ Booking Confirmed!</h3>

            <p><strong>Truck:</strong> <span id="popupTruck"></span></p>
            <p><strong>Date:</strong><span id="popupDate"></span></p>
            <p><strong>Route:</strong><span id="popupRoute"></span></p>
            <p><strong>Price:</strong><span id="popupPrice"></span></p>
            <p><strong>Status:</strong><span id="popupStatus"></span></p>
            <div class="popup-buttons">
               <button class="another-btn" onclick="location.href='advertising.html'">OK</button>
            </div>
        </div>
    </div>

    <div class="confirm-main">
        <div class="confirm-container">
            <h2 class="confirm-title">Confirm Booking</h2>
            <div class="confirm-row">
                <span id="rentedCapacityTitle">Rented capacity </span>
                <input type="number" id="rentedCapacity" placeholder="Enter required capacity">
            </div>
            <div id="rentedCapacityError" class="error-message"></div>
            <div class="confirm-row">
                <span>Route</span>
                <span id="route"></span>
            </div>
            <div class="confirm-row">
                <span>Distance</span>
                <span id="distance"></span>
            </div>
            <div class="confirm-row">
                <span>Estimated Time</span>
                <span id="estimatedTime"></span>
            </div>
            <p class="price-text" id="finalPrice"></p>
            <button class="confirm-btn" onclick="submitBooking()">Confirm Booking</button>
        </div>
    </div>
    <script src="../JavaScript/Booking.js"></script>
</body>
</html>
