<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../CSS/renterStyle.Css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <title>Post An Ad</title>
</head>

<body>
  <header class="top-header">
    <div class="header-left">
      <h2 class="welcome">Welcome, <span id="welcomeName"></span></h2>
    </div>
    <div class="header-right">
      <div class="icons">
        <i class="bi bi-bell-fill"></i>
        <i class="bi bi-person-circle"></i>
      </div>
    </div>
  </header>

  <nav>
    <a href="Dashboard.html"><i class="bi bi-house-fill"></i> Dashboard</a>
    <a href="postForm.html" class="bar-link"><i class="bi bi-download"></i> Post an ad</a>
    <a href="rentalRequests.html"><i class="bi bi-clipboard-check-fill"></i> Rental Requests</a>
    <a href="#"><i class="bi bi-clock-history"></i> Booking History</a>
    <a href="#"><i class="bi bi-bell-fill"></i> Notifications</a>
    <a href="HomePage.html"><i class="bi bi-box-arrow-right"></i> Log out</a>
  
  </nav>

  <main>
    <form id="truckForm" class="renterForm">
      <div class="form-top-right-image">
        <img src="../Photo/formTruck.png" alt="Truck Image" />
      </div>

      <div class="form-fields">
        <!-- Basic Truck Details -->
        <div class="oneBlock">
           <label class="formsTitle">Basic Truck Details</label>
 <label for="truck_type">Truck Type</label>
   
          <select id="truck_type">
            <option value="">Select truck type</option>
            <option>Refrigerated truck</option>
            <option>Box truck</option>
            <option>Flatbed truck</option>
            <option>Pickup Truck</option>
            <option>Van / Mini Truck</option>
            <option>Semi-Trailer / Tractor-Trailer</option>
            <option>Container Truck</option>
          </select>
          <div id="truck_typeError" class="error-message"></div>
         <label for="truck_id">Truck ID</label>
          <input id="truck_id" type="text" placeholder="Truck ID" />
          <div id="truck_idError" class="error-message"></div>

          <!-- dimension inputs + their error messages -->
          <div class="dimention">
            <div class="dim-field">
                      <label for="length">Length (m)</label>
              <input id="length" type="number" step="0.01" placeholder="Length" />
              <div id="lengthError" class="error-message"></div>
            </div>
            <div class="dim-field">
               <label for="width">Width (m)</label>
              <input id="width" type="number" step="0.01" placeholder="Width" />
              <div id="widthError" class="error-message"></div>
            </div>
            <div class="dim-field">
              <label for="height">Height (m)</label>
              <input id="height" type="number" step="0.01" placeholder="Height" />
              <div id="heightError" class="error-message"></div>
            </div>
          </div>
          <label for="max_volume">Maximum Volume (m³)</label>
          <input id="max_volume" type="number" step="0.01" placeholder="Maximum volume capacity (m³)" />
          <div id="max_volumeError" class="error-message"></div>
              <label for="max_weight">Maximum Weight (KG)</label>
          <input id="max_weight" type="number" step="0.01" placeholder="Maximum weight capacity (KG)" />
          <div id="max_weightError" class="error-message"></div>
        </div>

        <!-- Current Truck Details -->
        <div class="oneBlock">
           <label class="formsTitle">Current Truck Details</label>
           <label for="current_used_volume">Current Used Volume (m³)</label>
          <input id="current_used_volume" type="number" step="0.01" placeholder="must be less than max volume" />
          <div id="current_used_volumeError" class="error-message"></div>
         <label for="current_used_weight">Current Used Weight (KG)</label>
          <input id="current_used_weight" type="number" step="0.01" placeholder="must be less than max weight" />
          <div id="current_used_weightError" class="error-message"></div>
        </div>

        <!-- Accepted Goods -->
        <div class="oneBlock">
          <label>Accepted Goods Section</label>
            
          <div class="dropdown">
            <button type="button" class="dropdown-btn">Accepted Goods Section</button>
            <div class="dropdown-content">
              <label><input type="checkbox" value="general" /> General</label>
              <label><input type="checkbox" value="food" /> Food products</label>
              <label><input type="checkbox" value="electronics" /> Electronics</label>
              <label><input type="checkbox" value="clothing" /> Clothing</label>
              <label><input type="checkbox" value="Heavy" /> Heavy Equipment</label>
              <label><input type="checkbox" value="Other" id="otherCheckbox" />Other</label>
              
              <input type="text" id="otherInput" placeholder="Please specify" style="width:140px ;display: none;">
            </div>
          </div>
          <div id="accepted_goodsError" class="error-message"></div>
 <label for="restrictions">Restrictions</label>
          <input id="restrictions" type="text" placeholder="Restrictions on goods" />
          <div id="restrictionsError" class="error-message"></div>
        </div>

        <!-- Pricing -->
        <div class="oneBlock">
           <label class="formsTitle">Pricing</label>
          <label for="price_per_m3">Price per cubic meter </label>
          <input id="price_per_m3" type="number" step="0.01" placeholder="Price per cubic meter (SAR/m³)" />
          <div id="price_per_m3Error" class="error-message"></div>
 <label for="price_per_kg">Price per KG</label>
          <input id="price_per_kg" type="number" step="0.01" placeholder="Price per KG (SAR/kg)" />
          <div id="price_per_kgError" class="error-message"></div>
 <label for="price_per_km">Price per Kilometer </label>
          <input id="price_per_km" type="number" step="0.01" placeholder="Price per Kilometer (SAR/km)" />
          <div id="price_per_kmError" class="error-message"></div>
        </div>

        <!-- Route & Availability -->
        <div class="oneBlock">
          <label class="formsTitle">Route & Availability</label>
           <label for="pickup_location">Pickup location </label>
          <input id="pickup_location" type="text" placeholder="Pickup location (city)" />
          <div id="pickup_locationError" class="error-message"></div>
<label for="dropoff_location">Drop-off location </label>
          <input id="dropoff_location" type="text" placeholder="Drop-off location (city)" />
          <div id="dropoff_locationError" class="error-message"></div>
<label for="district">pickup Area</label>

          <input id="district" type="text" placeholder="District / Neighborhood / Area" />
          <div id="districtError" class="error-message"></div>
 <label for="final_request_date">Final date for receiving requests</label>
          <input  id="final_request_date"  type="date"/>
          <div id="final_request_dateError" class="error-message"></div>
        </div>

        <!-- Notes -->
        <div class="oneBlock">
          <label>Additional Notes</label>
          <input id="note" type="text" placeholder="Note" />
          <div id="noteError" class="error-message"></div>
        </div>

        <button type="submit" class="add">Add</button>
        <div id="formSuccess" class="success-message"></div>
      </div>
    </form>
  </main>

  <script src="../JavaScript/postFormValidation.js"></script>

  <script>
    let lastScrollTop = 0;
    const header = document.querySelector("header");
    window.addEventListener("scroll", () => {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      header.style.top = scrollTop > lastScrollTop ? "-90px" : "0";
      lastScrollTop = scrollTop;
    });

  </script>
</body>
</html>
